<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} {% endblock %}</title>
  {% block link %} {% endblock %}  
</head>
<body>
  <header class="cabecalho">
    <h1><a href="{{ url_for('index') }}">Sabor da Orla</a></h1>
    <span class="data" id="data-atual"></span>
  </header>
  <nav class="menu" aria-label="Navegação principal">
    <a href="{{ url_for('comandas') }}">Atendimentos</a>
    <a href="{{ url_for('produtos') }}">Produtos</a>
  </nav>
  <div class="barra-secao">{% block section %}{% endblock %}</div>
  <main class="conteudo">
    {% block content %}{% endblock %}
  </main>
  {% block script %}{% endblock %}
</body>
