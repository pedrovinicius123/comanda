{% extends 'base.html' %}
{% block title %}Produtos | Sabor da Orla{% endblock %}
{% block section %}Produtos{% endblock %}
{% block link %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/produtos.css') }}">
{% endblock %}
{% block content %}
<section class="painel">
  <h2>Adicionar produto à comanda</h2>
  <form id="form-produto">
    <div class="campo">
      <label for="id-commanda">Comanda</label>
      <select id="id-commanda" required></select>
    </div>
    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" maxlength="120" required>
    </div>
    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao"></textarea>
    </div>
    <div class="campo">
      <label for="preco">Preço (R$)</label>
      <input type="number" id="preco" min="0" step="0.01" required>
    </div>
    <div class="botoes">
      <button type="submit" class="btn-primario" id="btn-salvar">Adicionar produto</button>
    </div>
  </form>
  <p id="mensagem-produtos" role="alert"></p>
</section>
<section class="painel">
  <h2>Produtos registrados</h2>
  <div class="lista" id="lista-produtos" aria-live="polite"></div>
</section>
{% endblock %}
{% block script %}
<script type="module" src="{{ url_for('static', filename='js/script_produtos.js') }}"></script>
{% endblock %}
