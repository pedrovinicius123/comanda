{% extends 'base.html' %}
{% block title %}Atendimentos | Sabor da Orla{% endblock %}
{% block section %}Atendimentos{% endblock %}
{% block link %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/mesas.css') }}">
{% endblock %}
{% block content %}
<section class="painel atendimentos">
  <h2>Atendimentos</h2>
  <button type="button" class="btn-primario" id="btn-iniciar-atendimento">Iniciar atendimento</button>
  <p id="mensagem-atendimentos" role="alert"></p>
  <div class="lista" id="lista-atendimentos" aria-live="polite"></div>
</section>
{% endblock %}
{% block script %}
<script type="module" src="{{ url_for('static', filename='js/script_comanda.js') }}"></script>
{% endblock %}
